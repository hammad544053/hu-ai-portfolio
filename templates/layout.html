<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ config.hero_name }} — ML & AI Engineer{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="site-body">

  <!-- Universal Studio Background -->
  <div class="background-container"></div>

  <!-- Universal Interactive 3D Frame Canvas Layer -->
  <div class="canvas-container">
    <canvas id="animation-canvas"></canvas>
  </div>

  <!-- Universal Header Navigation -->
  <header>
    <a href="{{ url_for('index') }}" class="logo">{{ config.site_title }}</a>
    <nav id="main-nav">
      <ul class="nav-links">
        <li><a href="{{ url_for('index') }}">Home</a></li>
        <li><a href="{{ url_for('about') }}">About</a></li>
        <li><a href="{{ url_for('projects') }}">Projects</a></li>
        <li><a href="{{ url_for('certifications') }}">Certifications</a></li>
      </ul>
      <a href="{{ url_for('index') }}#contact" class="btn-orange">
        Get in touch
        <span class="btn-icon">➔</span>
      </a>
    </nav>

    <button class="hamburger" id="hamburger-btn" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Universal Mobile Drawer Overlay -->
  <div class="mobile-drawer" id="mobile-drawer">
    <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close Menu">✕</button>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('projects') }}">Projects</a>
    <a href="{{ url_for('certifications') }}">Certifications</a>
    <a href="{{ url_for('index') }}#contact" class="btn-orange">Get in touch ➔</a>
  </div>

  <!-- Page Content Container -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Universal Slim Footer -->
  <footer class="site-footer">
    <div class="section-container footer-content">
      <!-- LEFT: Contact Information -->
      <div class="footer-contact">
        <a href="https://wa.me/923209392671" target="_blank" class="footer-link">📱 +92 320 9392671</a>
        <span class="footer-divider">•</span>
        <a href="mailto:hk0448455@gmail.com" class="footer-link">✉️ hk0448455@gmail.com</a>
      </div>

      <!-- CENTER: Copyright Notice -->
      <p class="footer-copy">© 2026 {{ config.hero_name }}. All rights reserved.</p>

      <!-- RIGHT: Social Media Links -->
      <div class="footer-socials">
